version: '3.9'

services:

  # ── BASE DE DATOS: PostgreSQL ─────────────────────────
  # Se cambió desde SQL Server porque los alojamientos gratuitos (Render y
  # compañía) ofrecen PostgreSQL, y SQL Server pedía una licencia de pago.
  postgres:
    image: postgres:16-alpine
    container_name: recyroute_db
    environment:
      # Los valores viven en .env, que no se sube al repositorio. Antes
      # estaban escritos aquí y quedaron en cinco commits del historial.
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Se reinicia solo, igual que los otros dos. Antes no lo hacía y al
    # reabrir Docker la API arrancaba sin base de datos.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── APLICACIÓN: API ASP.NET Core ──────────────────────
  api:
    build:
      context: ./proyectosena   # ← apunta a la carpeta donde está el Dockerfile
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    container_name: recyroute_api
    ports:
      - "8080:8080"
    environment:
      # Ningún valor real vive en este archivo: todos salen de .env, que
      # se queda en cada equipo y no se versiona. Los que había antes
      # quedaron publicados en el historial y hubo que rotarlos todos.
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      Jwt__TokenExpirationMinutes: "${JWT_EXPIRATION_MINUTES}"
      EmailSettings__Host: "${EMAIL_HOST}"
      EmailSettings__Port: "${EMAIL_PORT}"
      EmailSettings__SenderEmail: "${EMAIL_SENDER}"
      EmailSettings__SenderName: "${EMAIL_SENDER_NAME}"
      EmailSettings__Password: "${EMAIL_PASSWORD}"
      # Administrador inicial. Solo se usa contra una base VACIA: si ya hay un
      # administrador, la siembra no se ejecuta y estas variables se ignoran.
      # El :- deja el valor vacio cuando la variable no esta en el .env, para no
      # llenar de avisos cada 'docker compose up'. La API trata el vacio como
      # ausente: sin ADMIN_PASSWORD genera una al azar y la escribe en el log.
      Admin__Email: "${ADMIN_EMAIL:-}"
      Admin__Password: "${ADMIN_PASSWORD:-}"
      Admin__DocumentNumber: "${ADMIN_DOCUMENT_NUMBER:-}"
      Admin__Name: "${ADMIN_NAME:-}"
      Admin__LastName: "${ADMIN_LAST_NAME:-}"
      # true: la API aplica las migraciones al arrancar (comodo en desarrollo).
      # false: se aplican como paso explicito del despliegue, sin carrera entre replicas.
      Database__MigrateOnStartup: "true"
      # false: la API no le cree a X-Forwarded-For. Aqui no hay proxy delante del
      # puerto 8080, y creerle dejaba saltarse el limite de intentos del login.
      # En Render va en "true" (panel Environment): alli la cabecera la pone su proxy.
      ForwardedHeaders__Enabled: "false"
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

 # ── FRONTEND: archivos estáticos servidos con Nginx ────
  frontend:
    image: nginx:alpine
    container_name: recyroute_frontend
    ports:
      - "8081:80"
    volumes:
      - ./proyectosena/wwwroot:/usr/share/nginx/html:ro   # ← Bind Mount: lee directo del host, sin rebuild
      # Sin este archivo Nginx no manda Cache-Control y el navegador sirve
      # versiones viejas: el panel del administrador salia en blanco y sin guardia.
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data: