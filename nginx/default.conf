# ============================================================
#  Nginx del frontend de RecyRoute
# ------------------------------------------------------------
#  Este archivo existe por un fallo concreto, no por gusto.
#
#  Nginx servía los archivos con ETag y Last-Modified pero SIN
#  cabecera Cache-Control. Cuando falta esa cabecera el navegador
#  aplica "caché heurística": se guarda la copia y la reutiliza
#  durante un rato sin preguntarle nada al servidor.
#
#  Se comprobó en el panel del administrador: el servidor tenía la
#  página de 9.955 bytes con su script, y el navegador de la
#  administradora seguía mostrando una versión vieja de 91 bytes y
#  CERO scripts. Sin script no se ejecuta requireRole(), o sea que
#  la pantalla se quedaba sin su guardia de rol y en blanco.
# ============================================================

server {
    # Solo IPv4 a proposito: si el contenedor no trae IPv6 habilitado, un
    # "listen [::]:80" impide que Nginx arranque y tumba el frontend entero.
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Sin esto Nginx arma "Location: http://localhost/login" y se pierde
    # el puerto publicado en el host (8081). Con "off" va relativo: /login
    absolute_redirect off;

    # "no-cache" NO significa "no guardes nada": significa
    # "guarda, pero pregunta siempre antes de usarlo". Como ya
    # se envía un ETag, esa pregunta se contesta con un 304
    # vacío cuando el archivo no ha cambiado: no se pierde
    # velocidad y nunca se sirve una versión vieja.
    #
    # Va a nivel de server para que cubra TODAS las locations, y con
    # "always" para que viaje también en los 302 y los 404.
    # OJO: un location hereda los add_header del server solo si no
    # declara ninguno propio; si alguno lo necesita, repetir aquí esta línea.
    add_header Cache-Control "no-cache" always;

    # ---------- URLs limpias ----------
    # try_files sirve el archivo sin volver a buscar location, así que
    # la barra de direcciones queda limpia y no choca con los 302 de abajo.
    location = /login           { try_files /pages/auth/login.html =404; }
    location = /register        { try_files /pages/auth/register.html =404; }
    location = /verify-email    { try_files /pages/auth/verify-email.html =404; }
    location = /forgot-password { try_files /pages/auth/password/forgot-password.html =404; }
    location = /reset-password  { try_files /pages/auth/password/reset-password.html =404; }
    location = /citizen         { try_files /pages/citizen/dashboard.html =404; }
    location = /manager         { try_files /pages/manager/dashboard.html =404; }
    location = /admin           { try_files /pages/admin/dashboard.html =404; }
    location = /chat            { try_files /pages/general/chat.html =404; }
    location = /profile         { try_files /pages/general/settings/profile.html =404; }
    location = /security        { try_files /pages/general/settings/security.html =404; }

    # ---------- Rutas viejas -> URL limpia ----------
    # 302 y no 301: el navegador guarda un 301 para siempre.
    location = /pages/auth/login.html                          { return 302 /login$is_args$args; }
    location = /pages/auth/register.html                       { return 302 /register$is_args$args; }
    location = /pages/auth/verify-email.html                   { return 302 /verify-email$is_args$args; }
    location = /pages/auth/password/forgot-password.html       { return 302 /forgot-password$is_args$args; }
    location = /pages/auth/password/reset-password.html        { return 302 /reset-password$is_args$args; }
    location = /pages/citizen/dashboard.html                   { return 302 /citizen$is_args$args; }
    location = /pages/manager/dashboard.html                   { return 302 /manager$is_args$args; }
    location = /pages/admin/dashboard.html                     { return 302 /admin$is_args$args; }
    location = /pages/general/chat.html                        { return 302 /chat$is_args$args; }
    location = /pages/general/settings/profile.html            { return 302 /profile$is_args$args; }
    location = /pages/general/settings/security.html           { return 302 /security$is_args$args; }

    # La raíz se sirve con try_files y no con "index": "index" haría una
    # redirección interna a /index.html, caería en el 302 de abajo y
    # entraría en un bucle infinito.
    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        return 302 /$is_args$args;
    }

    # CSS, JS, imágenes y demás archivos estáticos.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
