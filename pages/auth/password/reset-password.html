<!DOCTYPE html>
<!--paso 2: Restablecer contraseña-->
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecyRoute</title>
    <!--Favicon-->
    <link rel="icon" href="/assets/icons/recyroute.svg" />
    <!--Styles-->
    <link rel="stylesheet" href="/css/base/styles.css" />
    <link rel="stylesheet" href="/css/pages/auth/password/reset-password.css" />
</head>
<body>
    <header class="header-secundario">
        <h1 class="recyroute">recyroute</h1>
    </header>

    <main class="auth-wrapper">
        <div class="card">

            <!-- ══════════════════════════════════════════
                 PASO 1 – Verificar el código
                 El JS muestra un paso a la vez añadiendo
                 la clase "visible" con showStep().
            ══════════════════════════════════════════ -->
            <div id="step1" class="step">
                <h1 class="card__title">Verifica tu código</h1>
                <br />
                <p class="card__subtitle">
                    Escribe los 6 dígitos que enviamos a tu correo.
                </p>

                <!-- Seis casillas: el JS salta de una a otra y admite pegar el código entero -->
                <div class="form-group">
                    <label class="form-label" for="code1">Código de verificación</label>
                    <div class="code-row">
                        <input type="text" id="code1" class="form-input form-input--no-icon code-input" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Dígito 1" />
                        <input type="text" id="code2" class="form-input form-input--no-icon code-input" inputmode="numeric" maxlength="1" aria-label="Dígito 2" />
                        <input type="text" id="code3" class="form-input form-input--no-icon code-input" inputmode="numeric" maxlength="1" aria-label="Dígito 3" />
                        <input type="text" id="code4" class="form-input form-input--no-icon code-input" inputmode="numeric" maxlength="1" aria-label="Dígito 4" />
                        <input type="text" id="code5" class="form-input form-input--no-icon code-input" inputmode="numeric" maxlength="1" aria-label="Dígito 5" />
                        <input type="text" id="code6" class="form-input form-input--no-icon code-input" inputmode="numeric" maxlength="1" aria-label="Dígito 6" />
                    </div>
                    <!-- Mensaje de error local (lo maneja el JS) -->
                    <p id="codeError" class="form-hint form-hint--error" role="alert" style="display:none;"></p>
                </div>

                <button type="button" id="verifyBtn" class="btn btn-primary btn-login-main">
                    <span id="verifySpinner" class="btn-spinner" style="display:none;" aria-hidden="true"></span>
                    <span id="verifyLabel">Verificar código</span>
                </button>

                <!-- Pide un código nuevo si el anterior se venció -->
                <button type="button" id="resendBtn" class="btn btn-secondary">
                    Reenviar código
                </button>

                <a href="/pages/auth/login.html" class="form-hint form-hint--link">← Volver al inicio de sesión</a>
            </div>

            <!-- ══════════════════════════════════════════
                 PASO 2 – Nueva contraseña
            ══════════════════════════════════════════ -->
            <div id="step2" class="step">
                <h1 class="card__title">Nueva contraseña</h1>
                <br />
                <p class="card__subtitle">
                    Debe tener al menos 8 caracteres.
                </p>

                <!-- Campo: nueva contraseña -->
                <div class="form-group">
                    <label class="form-label" for="newPassword">Nueva contraseña</label>
                    <div class="form-input-wrapper">
                        <span class="form-input-icon icon-candado" aria-hidden="true"></span>
                        <input type="password"
                               id="newPassword"
                               class="form-input"
                               placeholder=""
                               autocomplete="new-password" />
                        <button type="button" class="toggle-pwd" data-target="newPassword" aria-label="Mostrar u ocultar la contraseña">
                            <span class="form-input-icon icon-ojocerrado" aria-hidden="true"></span>
                        </button>
                    </div>
                </div>

                <!-- Campo: confirmar contraseña -->
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirmar contraseña</label>
                    <div class="form-input-wrapper">
                        <span class="form-input-icon icon-candado" aria-hidden="true"></span>
                        <input type="password"
                               id="confirmPassword"
                               class="form-input"
                               placeholder=""
                               autocomplete="new-password" />
                        <button type="button" class="toggle-pwd" data-target="confirmPassword" aria-label="Mostrar u ocultar la contraseña">
                            <span class="form-input-icon icon-ojocerrado" aria-hidden="true"></span>
                        </button>
                    </div>
                    <!-- Mensaje de error local (lo maneja el JS) -->
                    <p id="passError" class="form-hint form-hint--error" role="alert" style="display:none;"></p>
                </div>

                <button type="button" id="resetBtn" class="btn btn-primary btn-login-main">
                    <span id="resetSpinner" class="btn-spinner" style="display:none;" aria-hidden="true"></span>
                    <span id="resetLabel">Restablecer contraseña</span>
                </button>
            </div>

            <!-- ══════════════════════════════════════════
                 PASO 3 – Listo
            ══════════════════════════════════════════ -->
            <div id="step3" class="step">
                <div class="success-state__icon" aria-hidden="true">✅</div>
                <h2 class="success-state__title">¡Contraseña actualizada!</h2>
                <p class="success-state__body">
                    Ya puedes entrar con tu nueva contraseña.
                </p>

                <button type="button" id="goToLoginBtn" class="btn btn-primary btn-login-main">
                    Ir al inicio de sesión
                </button>
            </div>

        </div>
    </main>
    <script type="module" src="/js/pages/auth/password/reset-password.js"></script>
</body>
</html>
