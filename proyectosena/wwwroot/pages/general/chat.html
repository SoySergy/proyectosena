<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecyRoute Chat</title>
    <!-- Favicon -->
    <link rel="icon" href="/assets/icons/recyroute.svg" />
    <!-- Base -->
    <link rel="stylesheet" href="/css/base/styles.css">
    <!-- Components -->
    <link rel="stylesheet" href="/css/components/headers/headerusuario.css">
    <link rel="stylesheet" href="/css/components/cards.css">
    <link rel="stylesheet" href="/css/components/form.css">
    <link rel="stylesheet" href="/css/components/notificaciones.css">
    <!-- Base de página: header, tarjetas y botones compartidos con los paneles -->
    <link rel="stylesheet" href="/css/pages/citizen/dashboard.css">
    <!-- Page -->
    <link rel="stylesheet" href="/css/pages/general/chat.css">
</head>
<body>
    <!-- ===== HEADER PRINCIPAL ===== -->
    <header class="header-usuario">
        <h1 class="recyroute">
            recyroute
        </h1>
        <div class="header-user">
            <span id="welcomeMsg" class="header-user__name"></span>
            <div class="notificaciones">
                <button class="notificaciones__boton" id="notifTrigger" type="button"
                        aria-label="Notificaciones" aria-haspopup="true" aria-expanded="false">
                    <span class="notificaciones__icono" aria-hidden="true"></span>
                    <span class="notificaciones__contador" id="notifCount" hidden></span>
                </button>
                <div class="notificaciones__panel" id="notifPanel" role="menu">
                    <div class="notificaciones__cabecera">
                        <span class="notificaciones__titulo">Notificaciones</span>
                    </div>
                    <div class="notificaciones__lista" id="notifList"></div>
                </div>
            </div>
            <div class="header-user__menu">
                <button class="header-user__trigger"
                        id="userMenuTrigger"
                        type="button"
                        aria-haspopup="true"
                        aria-expanded="false">
                    <span class="header-user__avatar" aria-hidden="true">
                        <img src="/assets/icons/usuario.svg" alt="" />
                    </span>
                </button>
                <div class="header-user__dropdown" id="userDropdown" role="menu">
                    <div class="dropdown-email" id="userEmail">cargando...</div>
                    <a href="/profile" class="dropdown-item" role="menuitem">
                        <img src="/assets/icons/configuracion.svg" alt="" class="dropdown-item__icon" />
                        Configuración
                    </a>
                    <div class="dropdown-separator"></div>
                    <button class="dropdown-item dropdown-item--danger" id="logoutBtn" type="button" role="menuitem">
                        <img src="/assets/icons/salir.svg" alt="" class="dropdown-item__icon" />
                        Cerrar sesión
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="dashboard-main">
        <section class="section active">
            <div class="card chat-card">
                <div class="section-header">
                    <div>
                        <h2 class="card__title">Chat de la solicitud</h2>
                        <p class="card__subtitle" id="chat-subtitle">Cargando...</p>
                    </div>
                    <button type="button" id="backBtn" class="btn btn-secondary">Volver</button>
                </div>

                <div id="chat-message" class="form-hint form-hint--error" role="alert"></div>
                <div id="chat-loading" class="loading-msg">Cargando mensajes...</div>

                <div id="chat-messages" class="chat-messages" hidden></div>

                <form id="chatForm" class="chat-form" hidden>
                    <div class="form-input-wrapper chat-form__input-wrapper">
                        <textarea id="chatInput"
                                  class="form-input form-textarea chat-form__textarea"
                                  placeholder="Escribe un mensaje..."
                                  required
                                  maxlength="1000"
                                  rows="2"></textarea>
                    </div>
                    <button type="submit" id="chatSendBtn" class="btn btn-primary">Enviar</button>
                </form>
            </div>
        </section>
    </main>

    <script type="module" src="/js/pages/general/chat.js"></script>
</body>
</html>
